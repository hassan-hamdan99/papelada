[project]
name = "papelada"
version = "0.3.0"
description = "Brazilian financial and fiscal paperwork for automation: boletos and utility slips (inspect, typo suggestions, find in text), NF-e XML, CPF/CNPJ (alphanumeric included), NF-e keys and Pix codes. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hassan Hamdan" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["boleto", "pix", "cnpj", "cpf", "nfe", "nfce", "xml", "febraban", "brasil", "linha digitavel", "nota fiscal", "cnab"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/hassan-hamdan99/papelada"

[project.scripts]
papelada = "papelada.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
papelada = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
